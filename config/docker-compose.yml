# Diabetes stack: MongoDB + Nightscout + tconnectsync
#
# One stack, one command:  docker compose up -d
#
# Secrets are NOT in this file and NOT in a plaintext .env. They live encrypted in
# secrets/*.sops.yaml and are decrypted to a tmpfs (SECRETS_DIR, default /run/diabetes)
# at service start by systemd/diabetes-stack.service. For local/dev bring-up you can
# decrypt them there by hand first (see secrets/README.md).
#
# Non-secret interpolation vars come from config/.env (copy from config/.env.template):
#   SECRETS_DIR, MONGO_DATA_DIR, TCONNECTSYNC_DATA_DIR
#
# Remote access is via Tailscale (`tailscale serve --bg --https=443 127.0.0.1:1337`),
# so Nightscout is bound to loopback only and there is no reverse proxy in this file.

name: diabetes

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ==========================================================================
  # MongoDB - Nightscout's datastore
  # ==========================================================================
  mongo:
    image: mongo:4.4
    container_name: nightscout-mongo
    restart: unless-stopped
    # Small-box memory cap; raise if the Beelink has RAM to spare.
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    volumes:
      - ${MONGO_DATA_DIR:-./data/mongo}:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  # ==========================================================================
  # Nightscout (cgm-remote-monitor)
  # ==========================================================================
  nightscout:
    image: nightscout/cgm-remote-monitor:latest
    container_name: nightscout
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - ${SECRETS_DIR:-/run/diabetes}/nightscout.env
    environment:
      MONGO_CONNECTION: mongodb://mongo:27017/nightscout
      NODE_ENV: production
      INSECURE_USE_HTTP: "true"
    ports:
      # Loopback only. Tailscale Serve exposes it to the tailnet.
      - "127.0.0.1:1337:1337"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:1337/api/v1/status.json',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging

  # ==========================================================================
  # tconnectsync - Tandem Source (Mobi / t:slim X2) -> Nightscout
  # Needs tconnectsync >= 2.0 for Tandem Source; the :latest image is fine.
  # ==========================================================================
  tconnectsync:
    image: ghcr.io/jwoglom/tconnectsync/tconnectsync:latest
    container_name: tconnectsync
    restart: unless-stopped
    depends_on:
      nightscout:
        condition: service_started
    env_file:
      - ${SECRETS_DIR:-/run/diabetes}/tconnectsync.env
    # Features are selected here (not via env). CGM is included as a lagged backup
    # copy of pump-ingested Dexcom data; the real-time feed is Nightscout's own
    # Dexcom Share integration. Drop CGM here if the double feed is noisy.
    command: ["--auto-update", "--features", "BASAL", "BOLUS", "PUMP_EVENTS", "PROFILES", "CGM"]
    volumes:
      # Persists the Tandem Source auth/token cache across restarts.
      # Confirm the in-image home dir before trusting this path:
      #   docker compose run --rm tconnectsync sh -c 'echo $HOME'
      - ${TCONNECTSYNC_DATA_DIR:-./data/tconnectsync}:/root/.config/tconnectsync
    logging: *default-logging

networks:
  default:
    name: diabetes-net
